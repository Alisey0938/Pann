<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت XRAY ULTRA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- کتابخانه تقویم شمسی -->
  <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
  
  <style>
    body { background-color: #090B10; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #131722; border: 1px solid #1E293B; border-radius: 16px; color: #FFF; }
    .nav-pills .nav-link { color: #94A3B8; border-radius: 12px; padding: 10px 20px; }
    .nav-pills .nav-link.active { background-color: #8B5CF6; color: #FFF; }
    .form-control, .form-select { background-color: #1E293B; border: 1px solid #334155; color: #FFF; border-radius: 10px; }
    .form-control:focus, .form-select:focus { background-color: #1E293B; color: #FFF; border-color: #8B5CF6; box-shadow: 0 0 0 0.25rem rgba(139, 92, 246, 0.25); }
    .table { color: #E2E8F0; }
    .badge-unlimited { background-color: #059669; }
    .datepicker-plot-area { font-family: inherit; }
  </style>
</head>
<body class="p-3 p-md-5">

  <div class="container-fluid max-width-lg">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
      <div>
        <h2 class="fw-bold text-primary mb-1"><i class="bi bi-shield-lock-fill me-2"></i>پنل مدیریت XRAY ULTRA</h2>
        <p class="text-secondary small mb-0">مدیریت اکانت‌ها براساس تاریخ و ساعت ایران</p>
      </div>
      <button class="btn btn-outline-light rounded-pill px-3" onclick="loadAllData()">
        <i class="bi bi-arrow-clockwise me-1"></i> بروزرسانی داده‌ها
      </button>
    </div>

    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="pills-users-tab" data-bs-toggle="pill" data-bs-target="#pills-users" type="button"><i class="bi bi-people-fill me-2"></i>مدیریت کاربران</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="pills-configs-tab" data-bs-toggle="pill" data-bs-target="#pills-configs" type="button"><i class="bi bi-hdd-network-fill me-2"></i>مدیریت کانفیگ‌ها</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="pills-announcement-tab" data-bs-toggle="pill" data-bs-target="#pills-announcement" type="button"><i class="bi bi-megaphone-fill me-2"></i>مدیریت اعلان‌ها</button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- تب کاربران -->
      <div class="tab-pane fade show active" id="pills-users">
        <div class="card p-4 mb-4">
          <h5 class="card-title mb-3"><i class="bi bi-person-plus-fill me-2"></i>ایجاد کاربر جدید (مشابه سنایی)</h5>
          <form id="addUserForm" onsubmit="handleCreateUser(event)">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label small text-secondary">نام کاربری</label>
                <input type="text" id="u_username" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small text-secondary">رمز عبور</label>
                <input type="text" id="u_password" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small text-secondary">تاریخ و ساعت انقضا (شمسی)</label>
                <input type="text" id="u_expire_date" class="form-control" placeholder="برای انتخاب کلیک کنید" required readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label small text-secondary">حجم (GB) (0 = نامحدود)</label>
                <input type="number" id="u_gb" class="form-control" step="0.1" value="0" required>
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary px-4" style="background-color: #8B5CF6; border: none;">ساخت اکانت</button>
              </div>
            </div>
          </form>
        </div>

        <div class="card p-4">
          <h5 class="card-title mb-3"><i class="bi bi-people me-2"></i>لیست کاربران</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr class="text-secondary border-bottom">
                  <th>نام کاربری</th>
                  <th>رمز عبور</th>
                  <th>تاریخ ساخت</th>
                  <th>زمان انقضا</th>
                  <th>حجم مصرفی</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="7" class="text-center py-4 text-secondary">در حال دریافت...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- تب کانفیگ‌ها -->
      <div class="tab-pane fade" id="pills-configs">
        <div class="card p-4 mb-4">
          <h5 class="card-title mb-3"><i class="bi bi-plus-circle-fill me-2"></i>افزودن کانفیگ</h5>
          <form id="addConfigForm" onsubmit="handleCreateConfig(event)">
            <div class="row g-3">
              <div class="col-md-4"><label class="form-label small text-secondary">نام سرور</label><input type="text" id="c_name" class="form-control" required></div>
              <div class="col-md-2"><label class="form-label small text-secondary">پرچم</label><input type="text" id="c_flag" class="form-control" value="🌐" required></div>
              <div class="col-md-6"><label class="form-label small text-secondary">لینک کانفیگ</label><input type="text" id="c_config" class="form-control" required></div>
              <div class="col-12 text-end"><button type="submit" class="btn btn-success px-4">ذخیره کانفیگ</button></div>
            </div>
          </form>
        </div>
        <div class="card p-4">
          <h5 class="card-title mb-3"><i class="bi bi-list-task me-2"></i>لیست کانفیگ‌ها</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr class="text-secondary border-bottom"><th>پرچم</th><th>نام سرور</th><th>لینک کانفیگ</th><th>وضعیت</th><th>عملیات</th></tr></thead>
              <tbody id="configsTableBody"><tr><td colspan="5" class="text-center py-4 text-secondary">در حال دریافت...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- تب اعلان‌ها -->
      <div class="tab-pane fade" id="pills-announcement">
        <div class="card p-4">
          <h5 class="card-title mb-3"><i class="bi bi-megaphone me-2"></i>تنظیمات بنر اطلاع‌رسانی</h5>
          <form id="announcementForm" onsubmit="handleSaveAnnouncement(event)">
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="a_enabled">
              <label class="form-check-label text-white" for="a_enabled">نمایش بنر در اپلیکیشن</label>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">متن اعلان</label>
              <textarea id="a_text" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">آدرس تصویر بنر</label>
              <input type="url" id="a_image_url" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label small text-secondary">لینک کلیک</label>
              <input type="url" id="a_target_url" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary px-4">ذخیره بنر</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- اسکریپت‌های تقویم شمسی -->
  <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

  <script>
    const FIREBASE_URL = "https://pane-dcc9a-default-rtdb.firebaseio.com/";
    let selectedExpireTimestamp = null;

    $(document).ready(function() {
      // راه اندازی تقویم شمسی همراه با انتخاب ساعت و دقیقه
      $("#u_expire_date").pDatepicker({
        format: 'YYYY/MM/DD HH:mm',
        timePicker: {
          enabled: true,
          meridiem: { enabled: false }
        },
        autoClose: true,
        onSelect: function(unix) {
          selectedExpireTimestamp = unix;
        }
      });

      loadAllData();
    });

    function loadAllData() {
      fetchUsers();
      fetchConfigs();
      fetchAnnouncement();
    }

    async function fetchUsers() {
      const tbody = document.getElementById('usersTableBody');
      try {
        const res = await fetch(`${FIREBASE_URL}users.json`);
        const data = await res.json();
        if (!data) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">هیچ کاربری یافت نشد.</td></tr>'; return; }
        let html = '';
        Object.keys(data).forEach(id => {
          const user = data[id];
          const createdShamsi = new persianDate(new Date(user.created_at)).format('YYYY/MM/DD HH:mm');
          const expireShamsi = user.expire_at ? new persianDate(new Date(user.expire_at)).format('YYYY/MM/DD HH:mm') : 'نامشخص';
          
          const maxGb = user.max_volume_gb || 0;
          const usedBytes = user.used_bytes || 0;
          const usedGb = (usedBytes / (1024 * 1024 * 1024)).toFixed(2);
          let volumeDisplay = maxGb === 0 
            ? `<span class="badge badge-unlimited">نامحدود (${usedGb} GB)</span>`
            : `<div><small>${usedGb} / ${maxGb} GB</small></div>`;

          html += `<tr class="border-bottom border-secondary">
            <td class="fw-bold">${user.username}</td>
            <td><code>${user.password}</code></td>
            <td><small>${createdShamsi}</small></td>
            <td><small class="text-warning">${expireShamsi}</small></td>
            <td>${volumeDisplay}</td>
            <td><span class="badge ${user.active ? 'bg-success' : 'bg-danger'}">${user.active ? 'فعال' : 'غیرفعال'}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-warning me-1" onclick="toggleUserStatus('${id}', ${!user.active})"><i class="bi bi-power"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${id}')"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html;
      } catch (err) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">خطا در دریافت!</td></tr>'; }
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      if (!selectedExpireTimestamp) {
        alert('لطفاً تاریخ انقضا را انتخاب کنید.');
        return;
      }

      const userId = 'user_' + Date.now();
      const userData = {
        username: document.getElementById('u_username').value.trim(),
        password: document.getElementById('u_password').value.trim(),
        active: true,
        expire_at: new Date(selectedExpireTimestamp).toISOString(),
        max_volume_gb: parseFloat(document.getElementById('u_gb').value) || 0,
        used_bytes: 0,
        created_at: new Date().toISOString()
      };

      await fetch(`${FIREBASE_URL}users/${userId}.json`, { method: 'PUT', body: JSON.stringify(userData) });
      document.getElementById('addUserForm').reset();
      selectedExpireTimestamp = null;
      fetchUsers();
    }

    async function toggleUserStatus(id, newStatus) {
      await fetch(`${FIREBASE_URL}users/${id}/active.json`, { method: 'PUT', body: JSON.stringify(newStatus) });
      fetchUsers();
    }

    async function deleteUser(id) {
      if (confirm('آیا از حذف مطمئن هستید؟')) {
        await fetch(`${FIREBASE_URL}users/${id}.json`, { method: 'DELETE' });
        fetchUsers();
      }
    }

    // --- مدیریت کانفیگ‌ها و اعلان‌ها ---
    async function fetchConfigs() {
      const tbody = document.getElementById('configsTableBody');
      try {
        const res = await fetch(`${FIREBASE_URL}configs.json`);
        const data = await res.json();
        if (!data) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">هیچ کانفیگی یافت نشد.</td></tr>'; return; }
        let html = '';
        Object.keys(data).forEach(id => {
          const config = data[id];
          if (!config) return;
          html += `<tr class="border-bottom border-secondary">
            <td class="fs-4">${config.flag || '🌐'}</td><td class="fw-bold">${config.name}</td>
            <td><small class="text-secondary text-break">${config.config}</small></td>
            <td><span class="badge ${config.active ? 'bg-success' : 'bg-secondary'}">${config.active ? 'فعال' : 'غیرفعال'}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-warning me-1" onclick="toggleConfigStatus('${id}', ${!config.active})"><i class="bi bi-power"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteConfig('${id}')"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html;
      } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">خطا در دریافت!</td></tr>'; }
    }

    async function handleCreateConfig(e) {
      e.preventDefault();
      const configId = 'config_' + Date.now();
      const configData = {
        id: configId,
        name: document.getElementById('c_name').value.trim(),
        flag: document.getElementById('c_flag').value.trim(),
        config: document.getElementById('c_config').value.trim(),
        active: true
      };
      await fetch(`${FIREBASE_URL}configs/${configId}.json`, { method: 'PUT', body: JSON.stringify(configData) });
      document.getElementById('addConfigForm').reset();
      fetchConfigs();
    }

    async function toggleConfigStatus(id, newStatus) {
      await fetch(`${FIREBASE_URL}configs/${id}/active.json`, { method: 'PUT', body: JSON.stringify(newStatus) });
      fetchConfigs();
    }

    async function deleteConfig(id) {
      if (confirm('آیا از حذف مطمئن هستید؟')) {
        await fetch(`${FIREBASE_URL}configs/${id}.json`, { method: 'DELETE' });
        fetchConfigs();
      }
    }

    async function fetchAnnouncement() {
      try {
        const res = await fetch(`${FIREBASE_URL}announcement.json`);
        const data = await res.json();
        if (data) {
          document.getElementById('a_enabled').checked = data.enabled || false;
          document.getElementById('a_text').value = data.text || '';
          document.getElementById('a_image_url').value = data.image_url || '';
          document.getElementById('a_target_url').value = data.target_url || '';
        }
      } catch (_) {}
    }

    async function handleSaveAnnouncement(e) {
      e.preventDefault();
      const announcementData = {
        enabled: document.getElementById('a_enabled').checked,
        text: document.getElementById('a_text').value.trim(),
        image_url: document.getElementById('a_image_url').value.trim(),
        target_url: document.getElementById('a_target_url').value.trim()
      };
      await fetch(`${FIREBASE_URL}announcement.json`, { method: 'PUT', body: JSON.stringify(announcementData) });
      alert('بنر با موفقیت ذخیره شد.');
    }
  </script>
</body>
</html>
